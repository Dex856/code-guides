# Deploy the static site to GitHub Pages.
#
# ONE-TIME PREREQUISITE (repository owner, ~10 seconds, cannot be automated):
#   repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Creating a Pages site requires administration:write, which the Actions
#   GITHUB_TOKEN can never be granted (github/actions/configure-pages#40), so
#   `enablement: true` can only ever fail with "Resource not accessible by
#   integration". After that one click, every push to main deploys automatically.
#
# Alternative without this workflow: set Source to "Deploy from a branch",
# branch main, folder /docs — the repository keeps a ready-made mirror there.
name: Deploy static guides to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble the site directory
        run: |
          mkdir -p _site
          # the site lives in ./site (index.html, cpp-guide.html, java-guide.html, python-guide.html, ...)
          cp -r site/. _site/
          test -f _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
